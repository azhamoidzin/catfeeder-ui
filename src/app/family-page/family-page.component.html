<div class="header">
  Family "{{ this.familyName }}"
</div>

<table mat-table [dataSource]="members" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <ng-container matColumnDef="registration">
    <th mat-header-cell *matHeaderCellDef> Registration date </th>
    <td mat-cell *matCellDef="let element"> {{element.registration}} </td>
  </ng-container>

  <ng-container matColumnDef="logIcon">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let element"> <img
      class="small-image" src="assets/images/notebook.png" (click)="logsClick($event, element)"
      matTooltip="Check user logs" [matTooltipPosition]="'above'"
    > </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="memberClick(row)"></tr>
</table>

<div *ngIf="myself.family_admin" (click)="addMember()" class="open-dialog-div">
  Add New
</div>
