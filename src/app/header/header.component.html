<header>
  <!-- Left section: time and stats -->
  <div class="left-section">
    <div class="time" id="current-time" matTooltip="Current server time" [matTooltipPosition]="'below'">
      {{ current_time }}
    </div>
    <div class="stats">
      <div class="stat-item" matTooltip="Total users" [matTooltipPosition]="'below'">
        <img src="assets/images/family.png" alt="Users Icon" />
        <span id="total-users">{{ total_users }}</span>
      </div>
      <!-- Feeders -->
      <div class="stat-item" matTooltip="Total feeders" [matTooltipPosition]="'below'">
        <img src="assets/images/feeders.png" alt="Feeders Icon" />
        <span id="total-feeders">{{ total_feeders }}</span>
      </div>
      <!-- Poured -->
      <div class="stat-item" matTooltip="Poured food total" [matTooltipPosition]="'below'">
        <img src="assets/images/poured.png" alt="Poured Icon" />
        <span id="total-poured">{{ total_poured }}</span>
      </div>
    </div>
  </div>

  <!-- Middle section: User name -->
  <div class="user-name" id="user-name">{{ name }}</div>

  <!-- Navigation bar -->
  <nav>
    <a routerLink="/profile">Profile</a>
    <a routerLink="/family">Family</a>
  </nav>
</header>
