<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content>
  <div class="form-group">
    <label for="field1">Name</label>
    <input matInput type="text" id="field1" name="field1" [(ngModel)]="inputData.name">
  </div>
  <div class="form-group">
    <label for="field2">Tags</label>
    <input matInput type="text" id="field2" name="field2" [(ngModel)]="inputData.tags">
  </div>
  <div class="form-group download">
    <label for="field3">Schedule</label>
    <input matInput type="text" id="field3" name="field3" [(ngModel)]="inputData.schedule">
    <button>Download</button>
  </div>
  <div class="form-group">
    <label for="field4">Meal</label>
    <input matInput type="text" id="field4" name="field4" [(ngModel)]="inputData.meal">
  </div>
  <div class="error-message">
    {{ errorMsg }}
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="click()">{{ buttonTitle }}</button>
</div>
