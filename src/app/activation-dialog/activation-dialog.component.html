<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content>
  <div class="form-group">
    <label for="field1">Enter password</label>
    <input matInput type="text" id="field1" name="field1" [(ngModel)]="inputData.password">
  </div>
  <div class="form-group">
    <label for="field2">Repeat password</label>
    <input matInput type="text" id="field2" name="field2" [(ngModel)]="inputData.passwordRepeat">
  </div>
  <div class="error-message">
    {{ errorMsg }}
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="click()">{{ buttonTitle }}</button>
</div>
