<div class="profile-page">
  <!-- Top Section: User Info -->
  <div class="user-info">
    <h2>{{ name }} profile</h2>
  </div>

  <div class="content-sections">
    <div class="feeders">
      <h3>Feeders</h3>
      <ul>
        <li *ngFor="let feeder of feeders">
          <app-feeder-instance [feeder]="feeder"></app-feeder-instance>
        </li>
      </ul>
      <div *ngIf="familyAdmin" (click)="addNewFeeder()" class="open-dialog-div"> Add new </div>
    </div>
  </div>
</div>
