<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content>
  <div class="form-group">
    <label for="field1">Name</label>
    <input matInput type="text" id="field1" name="field1" [(ngModel)]="inputData.name">
  </div>
  <div class="form-group">
    <label for="field2">Email</label>
    <input matInput type="text" id="field2" name="field2" [(ngModel)]="inputData.email">
  </div>
  <div class="form-group">
    <label for="field2">Family name</label>
    <input matInput type="text" id="field3" name="field3" [(ngModel)]="inputData.familyName">
  </div>
  <div class="error-message">
    {{ errorMsg }}
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="click()">{{ buttonTitle }}</button>
</div>
